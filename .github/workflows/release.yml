name: Release
on:
  push:
    branches: [ "master" ]
  push:
    tags: ["v*..", "v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    matrix:
      include:
      - os: ubuntu-latest
        target: x86_64-unknown-linux-gnu
        binary_name: tumburu_daw
        archive_name: tumburu_daw-x86_64-unknown-linux-gnu.tar.gz
      - os: macos-latest
        target: aarch64-apple-darwin
        binary_name: tumburu_daw
        archive_name: tumburu_daw-aarch64-apple-darwin.tar.gz
      - os: windows-latest
        target: x86_64-pc-windows-msvc
        binary_name: tumburu_daw.exe
        archive_name: tumburu_daw-x86_64-pc-windows-msvc.zip
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Install ALSA dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: Cache Cargo Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}
    - name: Build Optimized Binary
      run: cargo build --release --target ${{ matrix.target }}
    - name: Package Release Asset (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir dist
        cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/
        if [ -f "README.md" ]; then cp README.md dist/; fi
        if [ -f "LICENSE" ]; then cp LICENSE dist/; fi
        tar -czvf "${{ matrix.archive_name }}" -C dist .
    - name: Package Release Asset (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path dist
        Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination dist/
        if (Test-Path "README.md") { Copy-Item "README.md" -Destination dist/ }
        if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination dist/ }
        Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive_name }}"
  deploy-release:
    steps:
    - name: Publish Artifact to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.archive_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

