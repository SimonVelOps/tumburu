name: Rust

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run doc
      run: cargo doc --verbose --document-private-items --workspace --all-features --bins
    - name: Create redirect index.html
      run: echo '<meta http-equiv="refresh" content="0; url=tumburu/index.html">' > target/doc/index.html
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: target/doc

deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
